<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aetheria</title>
  <meta name="description" content="Aetheria — encyclopédie collaborative d'un univers de RP.">
  <meta name="theme-color" content="#0d1024">
  <meta property="og:title" content="Aetheria">
  <meta property="og:description" content="Encyclopédie collaborative d'un univers de RP : personnages, monde, bestiaire, magie…">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23e3b866'>✧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2026111407">
<script>
  // GitHub garde la page en mémoire jusqu'à 10 minutes : on vérifie s'il existe une version plus récente et on recharge tout seul
  document.addEventListener("DOMContentLoaded", function () {
    try {
      var ici = (document.querySelector('script[src*="app.js?v="]') || {}).src || "";
      var v = (ici.match(/v=(\d+)/) || [])[1];
      fetch(location.pathname + "?nocache=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
        var n = (t.match(/app\.js\?v=(\d+)/) || [])[1];
        if (v && n && n !== v && !sessionStorage.getItem("maj" + n)) { sessionStorage.setItem("maj" + n, "1"); location.replace(location.pathname + "?v=" + n + location.hash); }
      }).catch(function () {});
    } catch (e) {}
  });
</script>
</head>
<body>
  <header id="entete"></header>
  <main id="app" class="chargement"><div class="vide"><div class="vide-ic">✧</div><p>Chargement…</p></div></main>
  <footer class="pied">Aetheria · encyclopédie collaborative</footer>
  <nav class="onglets-bas" id="onglets" aria-label="Navigation"></nav>

  <script src="config.js?v=2026111407"></script>
  <script>
    // Charge Supabase seulement si le site est configuré
    (function () {
      var c = window.AETHERIA_CONFIG;
      var s = function (src) { document.write('<script src="' + src + '"><\/script>'); };
      if (c.SUPABASE_URL && c.SUPABASE_ANON_KEY) s("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js");
      else s("demo-data.js?v=2026111407");
    })();
  </script>
  <script src="mots-des.js?v=2026111407"></script>
  <script src="missions.js?v=2026111407"></script>
  <script src="combattant.js?v=2026111407"></script>
  <script src="api.js?v=2026111407"></script>
  <script src="app.js?v=2026111407"></script>
</body>
</html>
